name: Release Windows MSI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.98.0"
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Restore frontend dependencies
        run: npm --prefix frontend ci

      - name: Verify release version
        shell: pwsh
        run: node infrastructure/release/verify-version.mjs $env:GITHUB_REF_NAME

      - name: Test release tooling
        run: npm run test:release

      - name: Verify frontend
        run: |
          npm --prefix frontend run test
          npm --prefix frontend run build

      - name: Verify Rust
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --check
          cargo test --manifest-path backend/Cargo.toml
          cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build MSI
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: backend
          tauriScript: cargo tauri
          uploadPlainBinary: false
          uploadWorkflowArtifacts: false
          args: --bundles msi --target x86_64-pc-windows-msvc

      - name: Create MSI checksum
        id: checksum
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          $artifacts = $env:ARTIFACT_PATHS | ConvertFrom-Json
          $msi = @($artifacts | Where-Object { $_ -like '*.msi' })
          if ($msi.Count -ne 1) { throw "Expected one MSI artifact, found $($msi.Count)." }
          $checksumPath = "$($msi[0]).sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi[0]).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($msi[0]))" | Set-Content -Encoding ascii -NoNewline -LiteralPath $checksumPath
          "msi_path=$($msi[0])" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Create or verify draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          MSI_PATH: ${{ steps.checksum.outputs.msi_path }}
          CHECKSUM_PATH: ${{ steps.checksum.outputs.checksum_path }}
          RELEASE_NOTES: |
            Private Windows x64 test build.

            This MSI is not code-signed. Windows may show an Unknown publisher or SmartScreen warning.
            Complete the Windows release checklist before publishing this draft.
        run: |
          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          $msiPath = $env:MSI_PATH
          $checksumPath = $env:CHECKSUM_PATH

          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Refusing non-semantic release tag."
          }
          if (-not $repo) { throw "GITHUB_REPOSITORY is unavailable." }
          if (-not (Test-Path -LiteralPath $msiPath -PathType Leaf)) {
            throw "The MSI output is unavailable."
          }
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "The MSI checksum is unavailable."
          }
          if ([IO.Path]::GetExtension($msiPath) -cne '.msi') {
            throw "The release artifact is not an MSI."
          }
          if ($checksumPath -cne "$msiPath.sha256") {
            throw "The checksum does not match the MSI path."
          }

          $msiName = [IO.Path]::GetFileName($msiPath)
          $checksumName = [IO.Path]::GetFileName($checksumPath)
          $expectedNames = @($msiName, $checksumName)
          if ($msiName -ceq $checksumName) { throw "Release asset names must be unique." }

          $msiHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msiPath).Hash.ToLowerInvariant()
          $expectedChecksum = "$msiHash  $msiName"
          $actualChecksum = Get-Content -Raw -LiteralPath $checksumPath
          if ($actualChecksum -cne $expectedChecksum) {
            throw "The checksum file does not describe the selected MSI."
          }

          function Assert-DraftRelease($release, [bool] $requireBothAssets) {
            if (-not $release.isDraft) { throw "Refusing to modify a non-draft release." }
            if ($release.isPrerelease) { throw "Refusing an unexpected prerelease." }

            $assets = @($release.assets)
            $unexpected = @($assets | Where-Object { $expectedNames -cnotcontains $_.name })
            if ($unexpected.Count) {
              throw "Draft release contains unexpected assets: $($unexpected.name -join ', ')."
            }
            if ($requireBothAssets -and $assets.Count -ne 2) {
              throw "Draft release must contain exactly the MSI and its checksum."
            }

            foreach ($asset in $assets) {
              $localPath = if ($asset.name -ceq $msiName) { $msiPath } else { $checksumPath }
              if ([int64]$asset.size -ne (Get-Item -LiteralPath $localPath).Length) {
                throw "Existing release asset size does not match $($asset.name)."
              }
              $localHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $localPath).Hash.ToLowerInvariant()
              $localDigest = "sha256:$localHash"
              if ($asset.digest -cne $localDigest) {
                throw "Existing release asset digest does not match $($asset.name)."
              }
            }
          }

          $releaseJson = & gh release view $tag --repo $repo --json isDraft,isPrerelease,assets 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            $release = $releaseJson | ConvertFrom-Json
            Assert-DraftRelease $release $false

            $remoteNames = @($release.assets | ForEach-Object name)
            $missingPaths = @()
            if ($remoteNames -cnotcontains $msiName) { $missingPaths += $msiPath }
            if ($remoteNames -cnotcontains $checksumName) { $missingPaths += $checksumPath }
            if ($missingPaths.Count) {
              & gh release upload $tag @missingPaths --repo $repo
              if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
            }
          } else {
            & gh release create $tag $msiPath $checksumPath `
              --repo $repo `
              --draft `
              --verify-tag `
              --title "Dashy $tag" `
              --generate-notes `
              --notes $env:RELEASE_NOTES
            if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed." }
          }

          $finalJson = & gh release view $tag --repo $repo --json isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw "Draft release verification failed." }
          $finalRelease = $finalJson | ConvertFrom-Json
          Assert-DraftRelease $finalRelease $true

          $finalNames = @($finalRelease.assets | ForEach-Object name)
          foreach ($expectedName in $expectedNames) {
            if ($finalNames -cnotcontains $expectedName) {
              throw "Draft release is missing $expectedName."
            }
          }
