name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend, backend, and release tooling
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check the frontend
        run: npx tsc --noEmit -p .
        working-directory: frontend

      - name: Test the frontend
        run: npm test
        working-directory: frontend

      - name: Build the frontend
        run: npm run build
        working-directory: frontend

      - name: Install workspace tooling
        run: npm ci

      - name: Test the release tooling
        run: npm run test:release

      - name: Check that icon.ico matches icon.svg
        run: |
          npm run icons:build
          git diff --exit-code -- backend/icons/icon.ico

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: backend

      - name: Lint the backend
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: backend

      - name: Test the backend
        run: cargo test --locked
        working-directory: backend
